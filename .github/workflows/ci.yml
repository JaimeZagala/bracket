name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Run all checks
        shell: pwsh
        run: ./scripts/check.ps1
