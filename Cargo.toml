[workspace]
resolver = "3"
members = [
    "crates/bracket-core",
    "crates/bracket-syntax",
    "crates/bracket-index",
    "crates/bracket-search",
    "crates/bracket-session",
    "crates/bracket-update",
    "crates/bracket-ui",
    "crates/bracket-app",
]

# Single source of truth for version and metadata; every crate inherits it.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JaimeZagala/bracket"
publish = false

[workspace.dependencies]
bracket-core = { path = "crates/bracket-core" }
bracket-syntax = { path = "crates/bracket-syntax" }
bracket-index = { path = "crates/bracket-index" }
bracket-search = { path = "crates/bracket-search" }
bracket-session = { path = "crates/bracket-session" }
bracket-update = { path = "crates/bracket-update" }
bracket-ui = { path = "crates/bracket-ui" }

# External crates: versions are pinned here once and inherited with `.workspace = true`.
# Only LF, CRLF and CR count as line breaks (`cr_lines`), like Notepad++ and VS Code.
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
proptest = "1.12.0"
# glow (OpenGL) backend instead of the default wgpu: half the size, faster startup, far less RAM
# (measured in Phase 0, see docs/es/measurements.md). No `default_fonts`: system fonts are used.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "accesskit", "persistence"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Configuration: keeps comments and order when saving; read key by key so one bad value does
# not discard the whole file.
toml_edit = "0.25.17"
# Windows registry (HKCU/HKLM): installed fonts now, file associations in Phase 5.
winreg = "0.56.0"
# Encodings: decoding/encoding (WHATWG set) and guessing legacy encodings.
encoding_rs = "0.8.42"
chardetng = "1.0.0"
# Native file dialogs (IFileDialog on Windows); Linux portal features off.
rfd = { version = "0.17.2", default-features = false }
# Windows API bindings, only for what has no safe wrapper (ReplaceFileW, attaching to the
# parent console). Same version as the rest of the dependency tree.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
# File change notifications (ReadDirectoryChangesW on Windows) to reload files changed on disk.
# Without default features: they only select macOS backends.
notify = { version = "8.2.0", default-features = false }
# Syntax highlighting with Sublime Text grammars, pure Rust regex engine (no C). Each crate picks
# its features: the build script compiles the grammars, the executable only loads them.
syntect = { version = "5.3.0", default-features = false }
# Walking projects with .gitignore rules (ripgrep's walker), on several threads.
ignore = "0.4.33"
# Regular expressions for find and replace (linear time, no backtracking). Its engine,
# regex-automata, is already linked through syntect and globset.
regex = "1.13.1"
# Symbols: tree-sitter and its C#, CSS, JSON and XML grammars (C code compiled with MSVC). The
# C# grammar alone adds 5.4 MB, almost all of it a dense parse table (decisions/0003-symbols.md).
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-xml = "0.7.0"
# Moving files and folders to the Recycle Bin (IFileOperation on Windows). Without chrono: it is
# only needed to list what is in the bin.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
# Build time only: compiling the Windows resources (manifest, icon, version) with the SDK's
# rc.exe, and compressing the generated icon's largest size as PNG.
embed-resource = "3.0.12"
miniz_oxide = "0.9.1"

[workspace.lints.rust]
# `deny` (not `forbid`) so a justified exception can opt out locally with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
